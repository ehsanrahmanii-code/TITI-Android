name: Build TITI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: |
          bash scripts/decode_engine.sh
          ls -lh app/src/main/python/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Host pip bootstrap
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install six || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Android SDK path
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties

      - name: Wrapper + assembleDebug
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Show APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print -exec ls -lh {} \;
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          test -n "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TITI-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
